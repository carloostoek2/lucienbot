# 🎩 Lucien Bot - Configuración para Railway (SOLO servicio lucienbot)
# https://railway.app
#
# IMPORTANTE: Todo está bajo [services.lucienbot] para NO afectar Postgres.
# Postgres usa su propia imagen Docker y NO debe recibir esta configuración.

[services.lucienbot.build]
builder = "nixpacks"

[services.lucienbot.deploy]
startCommand = "alembic upgrade head && python bot.py"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3