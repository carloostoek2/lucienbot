# 🎩 Lucien Bot - Configuración para Railway (solo servicio lucienbot)
# https://railway.app
#
# Este archivo vive en el repo del bot. Postgres usa imagen Docker propia
# y NO debe redeployarse manualmente desde este repo.

[build]
builder = "nixpacks"

[deploy]
startCommand = "alembic upgrade head && python bot.py"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3